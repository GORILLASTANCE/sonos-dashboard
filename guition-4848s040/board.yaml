################################################################################
# board.yaml
# Hardware configuration for Guition ESP32-S3-4848S040
# 480x480 ST7701 RGB display, GT911 touch, LEDC backlight
################################################################################

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram:
  mode: octal
  speed: 80MHz

# SPI bus for ST7701 init sequence
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

# I2C for GT911 touchscreen
i2c:
  - id: touch_i2c
    sda: GPIO19
    scl: GPIO45
    scan: false

# Backlight
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms

# ST7701 RGB display
display:
  - platform: rpi_dpi_rgb
    id: main_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHz
    dimensions:
      width: 480
      height: 480
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    data_pins:
      red:
        - GPIO4
        - GPIO5
        - GPIO6
        - GPIO7
        - GPIO15
      green:
        - GPIO8
        - GPIO20
        - GPIO3
        - GPIO46
        - GPIO9
        - GPIO10
      blue:
        - GPIO11
        - GPIO12
        - GPIO13
        - GPIO14
        - GPIO0
    init_sequence:
      - delay 120
      - [ 0xFF, 0x77, 0x01, 0x00, 0x00, 0x10 ]
      - [ 0xC0, 0x3B, 0x00 ]
      - [ 0xC1, 0x0D, 0x02 ]
      - [ 0xC2, 0x31, 0x05 ]
      - [ 0xCD, 0x00 ]
      - [ 0xB0, 0x00, 0x11, 0x18, 0x0E, 0x11, 0x06, 0x07, 0x08, 0x07, 0x22, 0x04, 0x12, 0x0F, 0xAA, 0x31, 0x18 ]
      - [ 0xB1, 0x00, 0x11, 0x19, 0x0E, 0x12, 0x07, 0x08, 0x08, 0x08, 0x22, 0x04, 0x11, 0x11, 0xA9, 0x32, 0x18 ]
      - [ 0xFF, 0x77, 0x01, 0x00, 0x00, 0x11 ]
      - [ 0xB0, 0x60 ]
      - [ 0xB1, 0x32 ]
      - [ 0xB2, 0x07 ]
      - [ 0xB3, 0x80 ]
      - [ 0xB5, 0x49 ]
      - [ 0xB7, 0x85 ]
      - [ 0xB8, 0x21 ]
      - [ 0xC1, 0x78 ]
      - [ 0xC2, 0x78 ]
      - delay 20
      - [ 0xE0, 0x00, 0x1B, 0x02 ]
      - [ 0xE1, 0x08, 0xA0, 0x00, 0x00, 0x07, 0xA0, 0x00, 0x00, 0x00, 0x44, 0x44 ]
      - [ 0xE2, 0x11, 0x11, 0x44, 0x44, 0xED, 0xA0, 0x00, 0x00, 0xEC, 0xA0, 0x00, 0x00 ]
      - [ 0xE3, 0x00, 0x00, 0x11, 0x11 ]
      - [ 0xE4, 0x44, 0x44 ]
      - [ 0xE5, 0x0A, 0xE9, 0xD8, 0xA0, 0x0C, 0xEB, 0xD8, 0xA0, 0x0E, 0xED, 0xD8, 0xA0, 0x10, 0xEF, 0xD8, 0xA0 ]
      - [ 0xE6, 0x00, 0x00, 0x11, 0x11 ]
      - [ 0xE7, 0x44, 0x44 ]
      - [ 0xE8, 0x09, 0xE8, 0xD8, 0xA0, 0x0B, 0xEA, 0xD8, 0xA0, 0x0D, 0xEC, 0xD8, 0xA0, 0x0F, 0xEE, 0xD8, 0xA0 ]
      - [ 0xEB, 0x02, 0x00, 0xE4, 0xE4, 0x88, 0x00, 0x40 ]
      - [ 0xEC, 0x3C, 0x00 ]
      - [ 0xED, 0xAB, 0x89, 0x76, 0x54, 0x02, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x20, 0x45, 0x67, 0x98, 0xBA ]
      - [ 0xFF, 0x77, 0x01, 0x00, 0x00, 0x13 ]
      - [ 0xE5, 0xE4 ]
      - [ 0xFF, 0x77, 0x01, 0x00, 0x00, 0x00 ]
      - [ 0x36, 0x00 ]
      - [ 0x3A, 0x60 ]
      - [ 0x11 ]
      - delay 120
      - [ 0x29 ]
      - delay 20

# GT911 capacitive touch
touchscreen:
  - platform: gt911
    id: touch_screen
    i2c_id: touch_i2c
    address: 0x5D
    interrupt_pin: GPIO35
    reset_pin: GPIO36
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "Touch at (%d, %d)", touch.x, touch.y);
