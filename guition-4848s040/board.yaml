################################################################################
# board.yaml
# Hardware configuration for Guition ESP32-S3-4848S040
# 480x480 ST7701S display, GT911 touch, LEDC backlight
# Compatible with ESPHome 2026.x
################################################################################

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_ESP_PHY_ENABLE_USB: "n"
      CONFIG_USJ_ENABLE_USB_SERIAL_JTAG: "n"

psram:
  mode: octal
  speed: 80MHz

# SPI bus for ST7701S init sequence
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

# I2C for GT911 touchscreen
i2c:
  - id: touch_i2c
    sda: GPIO19
    scl: GPIO45
    scan: false

# Backlight
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms

# ST7701S display
display:
  - platform: st7701s
    id: main_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    invert_colors: false
    pclk_frequency: 12MHz
    pclk_inverted: false
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    data_pins:
      red:   [ GPIO4,  GPIO5,  GPIO6,  GPIO7,  GPIO15 ]
      green: [ GPIO8,  GPIO20, GPIO3,  GPIO46, GPIO9,  GPIO10 ]
      blue:  [ GPIO11, GPIO12, GPIO13, GPIO14, GPIO0  ]
    init_sequence:
      - 1
      - [ 0xFF, 0x77, 0x01, 0x00, 0x00, 0x10 ]
      - [ 0xCD, 0x00 ]

# GT911 capacitive touch
touchscreen:
  - platform: gt911
    id: touch_screen
    i2c_id: touch_i2c
    address: 0x5D
    interrupt_pin: GPIO35
    reset_pin: GPIO36
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "Touch at (%d, %d)", touch.x, touch.y);
