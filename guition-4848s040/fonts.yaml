################################################################################
# fonts.yaml
################################################################################

font:
  - file: "gfonts://Roboto"
    id: font_sm
    size: 16
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_md
    size: 22
    bpp: 4

  - file: "gfonts://Roboto@700"
    id: font_lg
    size: 28
    bpp: 4

  - file: "gfonts://Roboto@500"
    id: font_picker
    size: 26
    bpp: 4

  - file: "gfonts://Roboto@300"
    id: font_xl
    size: 48
    bpp: 4

  # MDI icons 36px
  # \U requires exactly 8 hex digits in YAML
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_36
    size: 36
    bpp: 4
    glyphs:
      - "\U000F004A"
      - "\U000F004B"
      - "\U000F004C"
      - "\U000F0051"
      - "\U000F0028"
      - "\U000F09C4"
      - "\U000F0060"

  # MDI icons 24px
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_24
    size: 24
    bpp: 4
    glyphs:
      - "\U000F09C4"
      - "\U000F0060"
