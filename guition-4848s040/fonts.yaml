################################################################################
# fonts.yaml
################################################################################

font:
  - file: "gfonts://Roboto"
    id: font_sm
    size: 16
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_md
    size: 22
    bpp: 4

  - file: "gfonts://Roboto@700"
    id: font_lg
    size: 28
    bpp: 4

  - file: "gfonts://Roboto@500"
    id: font_picker
    size: 26
    bpp: 4

  - file: "gfonts://Roboto@300"
    id: font_xl
    size: 48
    bpp: 4

  # MDI icons 36px - tagged version URL, correct ESPHome glyph format
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_36
    size: 36
    bpp: 4
    glyphs:
      - "\U000F04A"
      - "\U000F04B"
      - "\U000F04C"
      - "\U000F051"
      - "\U000F028"
      - "\U000F9C4"
      - "\U000F0060"

  # MDI icons 24px
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_24
    size: 24
    bpp: 4
    glyphs:
      - "\U000F9C4"
      - "\U000F0060"
