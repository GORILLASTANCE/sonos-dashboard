################################################################################
# fonts.yaml
# Font definitions using Roboto + MDI icons via ESPHome's built-in MDI support
################################################################################

font:
  - file: "gfonts://Roboto"
    id: font_sm
    size: 16
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_md
    size: 22
    bpp: 4

  - file: "gfonts://Roboto@700"
    id: font_lg
    size: 28
    bpp: 4

  - file: "gfonts://Roboto@500"
    id: font_picker
    size: 26
    bpp: 4

  - file: "gfonts://Roboto@300"
    id: font_xl
    size: 48
    bpp: 4

  # MDI icons 36px — using ESPHome built-in MDI font loader
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_36
    size: 36
    bpp: 4
    glyphs:
      - "\U000F04A"  # mdi-skip-previous
      - "\U000F04B"  # mdi-play
      - "\U000F04C"  # mdi-pause
      - "\U000F051"  # mdi-skip-next
      - "\U000F028"  # mdi-volume-high
      - "\U000F9C4"  # mdi-speaker
      - "\U000F0060" # mdi-arrow-left

  # MDI icons 24px
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_24
    size: 24
    bpp: 4
    glyphs:
      - "\U000F9C4"  # mdi-speaker
      - "\U000F0060" # mdi-arrow-left
