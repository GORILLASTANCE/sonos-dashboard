################################################################################
# fonts.yaml
# Font definitions using Roboto + MDI icons
# Glyphs specified as hex codepoint strings (ESPHome 2026.x compatible)
################################################################################

font:
  # UI labels - small
  - file: "gfonts://Roboto"
    id: font_sm
    size: 16
    bpp: 4

  # Artist name, time labels
  - file: "gfonts://Roboto"
    id: font_md
    size: 22
    bpp: 4

  # Track title
  - file: "gfonts://Roboto@700"
    id: font_lg
    size: 28
    bpp: 4

  # Speaker picker room names
  - file: "gfonts://Roboto@500"
    id: font_picker
    size: 26
    bpp: 4

  # Large volume / progress numbers
  - file: "gfonts://Roboto@300"
    id: font_xl
    size: 48
    bpp: 4

  # MDI icons - 36px (main controls)
  # 0xF04A = skip-previous
  # 0xF04B = play
  # 0xF04C = pause
  # 0xF051 = skip-next
  # 0xF028 = volume-high
  # 0xF9C4 = speaker
  # 0xF060 = arrow-left
  - file: "https://cdnjs.cloudflare.com/ajax/libs/MaterialDesign-Webfont/7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_36
    size: 36
    bpp: 4
    glyphs: [
      0xF04A,
      0xF04B,
      0xF04C,
      0xF051,
      0xF028,
      0xF9C4,
      0xF060,
    ]

  # MDI icons - 24px (small nav buttons)
  - file: "https://cdnjs.cloudflare.com/ajax/libs/MaterialDesign-Webfont/7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_24
    size: 24
    bpp: 4
    glyphs: [
      0xF9C4,
      0xF060,
    ]
