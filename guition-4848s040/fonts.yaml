################################################################################
# fonts.yaml
# Font definitions using Roboto + MDI icons
################################################################################

font:
  - file: "gfonts://Roboto"
    id: font_sm
    size: 16
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_md
    size: 22
    bpp: 4

  - file: "gfonts://Roboto@700"
    id: font_lg
    size: 28
    bpp: 4

  - file: "gfonts://Roboto@500"
    id: font_picker
    size: 26
    bpp: 4

  - file: "gfonts://Roboto@300"
    id: font_xl
    size: 48
    bpp: 4

  # MDI icons 36px
  # 0xF04A=skip-prev 0xF04B=play 0xF04C=pause
  # 0xF051=skip-next 0xF028=volume 0xF9C4=speaker 0xF060=arrow-left
  - file: "https://cdnjs.cloudflare.com/ajax/libs/MaterialDesign-Webfont/7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_36
    size: 36
    bpp: 4
    glyphs: ["\uf04a", "\uf04b", "\uf04c", "\uf051", "\uf028", "\uf9c4", "\uf060"]

  # MDI icons 24px
  - file: "https://cdnjs.cloudflare.com/ajax/libs/MaterialDesign-Webfont/7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_24
    size: 24
    bpp: 4
    glyphs: ["\uf9c4", "\uf060"]
